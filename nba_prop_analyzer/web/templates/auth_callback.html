<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — NBA Prop Analyzer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">
  <header class="masthead">
    <a href="/" class="wordmark" style="text-decoration:none; color:inherit;">matchup<span>edge</span></a>
  </header>

  <div class="about-page" style="max-width: 420px; margin-top: 2rem;">
    <div class="showcase" style="text-align:center">
      <h3 id="statusTitle">Signing you in…</h3>
      <p id="statusMsg" class="empty-hint" style="margin-top: 0.5rem;"></p>

      <div id="resetForm" style="display:none; text-align:left; margin-top: 1rem;">
        <label style="display:block; font-size:0.85rem; color:var(--text-muted); margin-bottom:0.35rem;">New password</label>
        <input type="password" id="newPassword" placeholder="At least 8 characters" style="width:100%; margin-bottom:0.85rem;">
        <button type="button" class="btn" id="resetSubmit" style="width:100%;">Set new password</button>
      </div>

      <button type="button" class="btn" id="activateBtn" style="display:none; margin-top:1rem;">Activate my account</button>

      <a href="/" id="backLink" class="btn" style="display:none; text-decoration:none; margin-top:1rem;">Back to app</a>
    </div>
  </div>
</div>

<script>
function showResult(title, msg, isError) {
  document.getElementById('statusTitle').textContent = title;
  document.getElementById('statusMsg').textContent = msg;
  document.getElementById('statusMsg').style.color = isError ? 'var(--red)' : '';
  document.getElementById('backLink').style.display = 'inline-block';
}

function submitReset(payload) {
  return fetch('/auth/reset-password', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  })
    .then(async (resp) => {
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || 'Something went wrong.');
      window.location.replace('/');
    });
}

function showResetForm(onSubmit) {
  document.getElementById('statusTitle').textContent = 'Reset your password';
  document.getElementById('statusMsg').textContent = 'Choose a new password for your account.';
  document.getElementById('resetForm').style.display = 'block';

  document.getElementById('resetSubmit').addEventListener('click', () => {
    const password = document.getElementById('newPassword').value;
    if (password.length < 8) {
      showResult('Reset your password', 'Password must be at least 8 characters.', true);
      document.getElementById('resetForm').style.display = 'block';
      return;
    }
    onSubmit(password).catch((err) => {
      document.getElementById('resetForm').style.display = 'block';
      showResult('Reset your password', err.message, true);
    });
  });
}

// New-style links (query string: ?token_hash=...&type=recovery|signup) --
// these route through this page first and only redeem the one-time token
// on an explicit click, so an email scanner prefetching the link can't
// burn it before the real user gets here. See auth.py's verify_otp().
const query = new URLSearchParams(window.location.search);
const tokenHash = query.get('token_hash');
const queryType = query.get('type');

// Legacy links (URL fragment: #access_token=...&type=...) from
// already-sent emails still using the old ConfirmationURL format.
const hash = window.location.hash.startsWith('#') ? window.location.hash.slice(1) : '';
const hashParams = new URLSearchParams(hash);
const accessToken = hashParams.get('access_token');
const hashType = hashParams.get('type');

const error = hashParams.get('error_description') || hashParams.get('error')
  || query.get('error_description') || query.get('error');

if (error) {
  showResult('Sign-in failed', decodeURIComponent(error.replace(/\+/g, ' ')) + ' — request a new link.', true);
} else if (tokenHash && queryType === 'recovery') {
  showResetForm((password) => submitReset({ token_hash: tokenHash, password }));
} else if (tokenHash && queryType === 'signup') {
  document.getElementById('statusTitle').textContent = 'Confirm your account';
  document.getElementById('statusMsg').textContent = 'Click below to finish activating your account.';
  const activateBtn = document.getElementById('activateBtn');
  activateBtn.style.display = 'inline-block';
  activateBtn.addEventListener('click', () => {
    activateBtn.disabled = true;
    activateBtn.textContent = 'Activating…';
    fetch('/auth/confirm-signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token_hash: tokenHash }),
    })
      .then(async (resp) => {
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error || 'Something went wrong.');
        window.location.replace('/');
      })
      .catch((err) => {
        activateBtn.style.display = 'none';
        showResult('Confirmation failed', err.message, true);
      });
  });
} else if (!accessToken) {
  showResult('Sign-in failed', 'No sign-in token found in this link — request a new one.', true);
} else if (hashType === 'recovery') {
  showResetForm((password) => submitReset({ access_token: accessToken, password }));
} else {
  fetch('/auth/complete-login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ access_token: accessToken }),
  })
    .then(async (resp) => {
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || 'Something went wrong.');
      window.location.replace('/');
    })
    .catch((err) => showResult('Sign-in failed', err.message, true));
}
</script>
</body>
</html>
